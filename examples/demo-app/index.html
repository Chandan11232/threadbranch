<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acme — Sign up</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f5; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; width: min(360px, 90vw); display: grid; gap: .75rem; }
    input, button { font: inherit; padding: .6rem; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #333; color: #fff; border: 0; cursor: pointer; }
    #out { min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Join Acme</h1>
    <input name="name" placeholder="Name">
    <input name="email" placeholder="Email">
    <input name="password" type="password" placeholder="Password">
    <button>Sign up</button>
    <div id="out"></div>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const out = document.getElementById('out');
      const button = e.target.querySelector('button');
      if (location.protocol === 'file:') {
        out.textContent = 'Open this page through the server (npm start, then http://localhost:3000), not as a file.';
        return;
      }
      button.disabled = true;
      out.textContent = 'Signing up…';
      try {
        const res = await fetch('/signup', { method: 'POST', body: new URLSearchParams(new FormData(e.target)) });
        const data = await res.json().catch(() => null);
        if (!data) throw new Error(`server replied ${res.status} ${res.statusText}`);
        out.textContent = data.ok ? `Welcome, ${data.welcome}!` : data.errors.join(' · ');
      } catch (err) {
        out.textContent = `Sign up failed: ${err.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
